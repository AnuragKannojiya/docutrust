[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docutrust"
version = "0.1.0"
description = "Enterprise RAG platform with corrective self-correction and strict citations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DocuTrust" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "motor>=3.4",
    "pymongo>=4.6",
    "langchain>=0.2,<0.3",
    "langchain-core>=0.2,<0.3",
    "langgraph>=0.2,<0.3",
    "langchain-openai>=0.1",
    "openai>=1.30",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "numpy>=1.26,<3.0",
    "pypdf>=4.1",
    "python-docx>=1.1",
    "tiktoken>=0.7",
    "duckduckgo-search>=4.4",
    "httpx>=0.27",
    "streamlit>=1.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "pytest-mock>=3.14"]

[project.scripts]
docutrust-seed = "scripts.seed_corpus:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
